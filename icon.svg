<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#1d2640"/>
      <stop offset=".55" stop-color="#10141f"/>
      <stop offset="1" stop-color="#07090d"/>
    </radialGradient>
    <linearGradient id="six" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8ffc6"/>
      <stop offset=".45" stop-color="#53d769"/>
      <stop offset="1" stop-color="#1f9e47"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sq"><rect width="512" height="512"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- faint grid -->
    <g stroke="#53d769" stroke-opacity=".07" stroke-width="2">
      <path d="M0 128H512M0 256H512M0 384H512M128 0V512M256 0V512M384 0V512"/>
    </g>
    <!-- the 6 -->
    <g filter="url(#glow)">
      <path fill="url(#six)" fill-rule="evenodd"
        d="M318 70 L360 112 C300 128 258 160 232 204 C248 196 266 192 286 192
           C356 192 404 242 404 312 C404 386 348 440 270 440
           C186 440 128 378 128 290 C128 186 196 104 318 70 Z
           M268 258 C232 258 206 284 206 318 C206 352 232 378 268 378
           C304 378 328 352 328 318 C328 284 304 258 268 258 Z"/>
    </g>
    <!-- rising edge arrow -->
    <g filter="url(#glow)">
      <path d="M70 430 L190 330 L262 372 L404 196" fill="none" stroke="url(#arrow)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M352 182 L432 164 L418 246 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
